name: CycleWrench
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
targets:
  CycleWrench:
    type: application
    platform: iOS
    sources: [CycleWrench]
    entitlements:
      path: CycleWrench/CycleWrench.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.cyclewrench]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    info:
      path: CycleWrench/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyclewrench
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: CycleWrench
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  CycleWrenchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CycleWrenchTests]
    dependencies:
      - target: CycleWrench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyclewrench.tests
schemes:
  CycleWrench:
    build:
      targets:
        CycleWrench: all
    test:
      targets: [CycleWrenchTests]
